<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đức Attendance · Màn hình QR</title>
<style>:root{font-family:system-ui,sans-serif;color:#14213d;background:#f3f6fc}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:960px;margin:auto}.hero{padding:30px;border-radius:24px;background:linear-gradient(120deg,#155eef,#00359e);color:white}h1{margin:0 0 8px;font-size:30px}.muted{color:#667085}.hero p{color:#dbe7ff;margin-bottom:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1fr);gap:24px;margin-top:24px}.card{background:white;padding:24px;border-radius:20px;border:1px solid #e3eaf3}label{display:block;font-weight:600;margin:16px 0 7px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid #cbd5e1;background:white}button{background:#155eef;color:white;border:0;margin-top:18px;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#eef3ff;color:#155eef}#message{white-space:pre-wrap;margin:18px 0;line-height:1.5}#qr{text-align:center;min-height:360px;display:flex;align-items:center;justify-content:center;flex-direction:column}#qr img{width:min(100%,320px);height:auto}.count{font-size:28px;font-weight:700;color:#155eef}[hidden]{display:none!important}@media(max-width:650px){body{padding:16px}.layout{grid-template-columns:1fr}.hero{padding:24px}h1{font-size:26px}}</style></head>
<body><main><section class="hero"><h1>Đức Attendance</h1><p>Màn hình QR cho quản trị viên · Nhân viên quét bằng ứng dụng Android</p></section><div id="message" role="status" aria-live="polite"></div>
<section class="layout"><div class="card"><form id="loginForm"><h2>Đăng nhập quản trị</h2><label for="username">Tên đăng nhập</label><input id="username" autocomplete="username" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button>Tiếp tục</button></form>
<form id="otpForm" hidden><h2 id="otpTitle">Xác minh Email OTP</h2><p class="muted" id="destination"></p><button type="button" class="secondary" id="send">Gửi mã qua email</button><label for="otp">Mã OTP 6 chữ số</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button>Xác minh</button><button type="button" class="secondary" id="back">Quay lại đăng nhập</button></form>
<form id="qrForm" hidden><h2>Phiên QR chấm công</h2><p id="signedIn" class="muted"></p><label for="location">Địa điểm công ty</label><select id="location" required></select><button>Bắt đầu hiển thị QR tự đổi</button><button type="button" class="secondary" id="logout">Đăng xuất</button></form></div>
<div class="card" id="qr"><h2>QR sẽ hiển thị ở đây</h2><p class="muted">Đăng nhập bằng tài khoản Admin đã được xác minh.<br>Token chỉ giữ trong bộ nhớ của trang và được xóa khi tải lại.</p></div></section></main>
<script>
'use strict';
let token=null,flow=null,challenge=null,expires=0,qrUrl=null,qrId=null,cooldown=0;
const $=id=>document.getElementById(id),message=(text,error=false)=>{ $('message').textContent=text;$('message').style.color=error?'#b42318':'#155eef'; };
const show=id=>['loginForm','otpForm','qrForm'].forEach(x=>$(x).hidden=x!==id);
async function api(path,body,method){const r=await fetch('/api/v1'+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){let e={};try{e=await r.json();}catch{}if(r.status===401&&token){token=null;show('loginForm');}throw Error(e.detail||Object.values(e.errors||{}).flat().join('\n')||'Yêu cầu không thành công ('+r.status+').');}return r.status===204?{}:r.json();}
async function busy(form,action){const buttons=[...$(form).querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await action();}catch(e){message(e.message,true);}finally{buttons.forEach(b=>b.disabled=false);}}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();busy('loginForm',async()=>{flow=await api('/auth/login',{username:$('username').value.trim(),password:$('password').value});$('password').value='';challenge=null;$('destination').textContent=flow.maskedEmail;$('otp').value='';show('otpForm');message('Bấm gửi mã rồi kiểm tra email, kể cả thư rác.');});});
$('send').addEventListener('click',()=>busy('otpForm',async()=>{if(Date.now()<cooldown)throw Error('Hãy chờ 60 giây giữa hai lần gửi.');const r=await api('/auth/otp/send',{flowId:flow.flowId,flowToken:flow.flowToken,channel:'Email'});challenge=r.challengeId;cooldown=Date.now()+60000;message('Dịch vụ đã chấp nhận gửi mã. Hãy kiểm tra email.');}));
$('otpForm').addEventListener('submit',e=>{e.preventDefault();busy('otpForm',async()=>{if(!challenge)throw Error('Hãy gửi mã trước.');const path=flow.purpose==='VerifyEmail'?'/auth/email-verification/verify':'/auth/login/otp/verify';const r=await api(path,{flowId:flow.flowId,flowToken:flow.flowToken,challengeId:challenge,code:$('otp').value});if(flow.purpose==='VerifyEmail'){show('loginForm');message('Email đã được xác minh. Hãy đăng nhập lại.');return;}if(r.user.role!=='Admin')throw Error('Màn hình này dành cho quản trị viên.');token=r.accessToken;$('signedIn').textContent=r.user.fullName;await options();show('qrForm');message('Đã đăng nhập. Chọn địa điểm; QR dùng chung cho mọi nhân viên và lượt vào/ra.');});});
async function all(path){let items=[],p=1;while(true){const r=await api(path+'?page='+p+'&pageSize=100');items.push(...r.items);if(items.length>=r.totalCount||!r.items.length)return items;p++;}}
async function options(){const locations=await all('/work-locations');$('location').replaceChildren();locations.filter(x=>x.isActive).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('location').append(o);});}
let rotating=false,rendering=false,refreshAt=0,displayToken=null;
async function rotateQr(){if(!rotating||rendering||!token)return;rendering=true;try{
const r=await api('/qr-sessions/display/refresh',{displayToken});
const image=await fetch('/api/v1/qr-sessions/render',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({qrToken:r.qrToken})});
if(!image.ok)throw Error('Chưa tải được QR. Đang thử lại.');if(qrUrl)URL.revokeObjectURL(qrUrl);qrUrl=URL.createObjectURL(await image.blob());expires=Date.now()+Math.max(0,Date.parse(r.expiresAtUtc)-Date.parse(r.serverTimeUtc));refreshAt=Date.now()+45000;
const img=document.createElement('img');img.alt='QR chung tại công ty';img.src=qrUrl;const count=document.createElement('p');count.id='count';count.className='count';$('qr').replaceChildren(count,img);message('QR tự đổi mỗi 45 giây, có hiệu lực 60 giây. Nhân viên bấm vào/ra ca rồi quét mã này.');tick();
}catch(e){message(e.message,true);refreshAt=Date.now()+5000;}finally{rendering=false;}}
$('qrForm').addEventListener('submit',e=>{e.preventDefault();busy('qrForm',async()=>{const d=await api('/qr-sessions/display',{workLocationId:$('location').value});displayToken=d.displayToken;rotating=true;await rotateQr();});});
function tick(){const c=$('count');if(c){const n=Math.max(0,Math.ceil((expires-Date.now())/1000));c.textContent=n?'Còn '+n+' giây':'QR đã hết hạn';if(!n){const img=$('qr').querySelector('img');if(img)img.remove();}}}
setInterval(()=>{tick();if(rotating&&Date.now()>=refreshAt)rotateQr();},1000);
$('back').onclick=()=>{flow=null;challenge=null;show('loginForm');};
$('logout').onclick=async()=>{rotating=false;displayToken=null;try{if(token)await api('/auth/logout',{});}catch(e){message(e.message,true);}finally{token=null;flow=null;challenge=null;expires=0;if(qrUrl)URL.revokeObjectURL(qrUrl);$('qr').replaceChildren();show('loginForm');message('Đã đăng xuất trên trang này.');}};
</script></body></html>
